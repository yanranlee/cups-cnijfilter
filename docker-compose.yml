version: '3.8'

services:
  cupsd:
#    image: docker.1ms.run/olbat/cupsd:latest
    image: cups-mp280:latest
    container_name: cupsd
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - USER_UID=1026
      - USER_GID=100
    volumes:
      - ./cupsd.conf:/etc/cups/cupsd.conf
      - ./spool:/var/spool/cups
      - /var/run/dbus:/var/run/dbus
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/bus/usb:/dev/bus/usb